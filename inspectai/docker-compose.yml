services:
  ai-service:
    image: ${REGISTRY:-inspectai}/ai-service:${INSPECTAI_VERSION:-dev}
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    environment:
      AI_SERVICE_ADDR: "0.0.0.0"
      AI_SERVICE_PORT: "9100"
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_VISION_MODEL: ${QWEN_VISION_MODEL:-qwen-vl-plus}
      QWEN_VISION_FALLBACK: ${QWEN_VISION_FALLBACK:-qwen-vl-max}
      QWEN_TEXT_MODEL: ${QWEN_TEXT_MODEL:-qwen-plus}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_CHAT_MODEL: ${DEEPSEEK_CHAT_MODEL:-deepseek-chat}
      DEEPSEEK_REPORT_MODEL: ${DEEPSEEK_REPORT_MODEL:-deepseek-chat}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-30}
      TMP_IMAGE_TTL_HOURS: ${TMP_IMAGE_TTL_HOURS:-24}
    volumes:
      - ./storage:/app/storage
    ports:
      - "19100:9100"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/health"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  go-backend:
    image: ${REGISTRY:-inspectai}/go-backend:${INSPECTAI_VERSION:-dev}
    build:
      context: .
      dockerfile: go-backend/Dockerfile
    environment:
      BACKEND_ADDR: ":8080"
      AI_SERVICE_URL: "http://ai-service:9100"
      FRONTEND_DIR: "/app/frontend"
      # 新版移动端占根路径;要回滚指回 /app/frontend 即可,不用重建镜像
      MOBILE_WEB_DIR: "/app/mobile-web/dist"
      STORAGE_DIR: "/app/storage"
      GOTELEMETRY: "off"
      INSPECTAI_AUTH_TOKEN: ${INSPECTAI_AUTH_TOKEN:-}
      INSPECTAI_SUPERVISOR_TOKEN: ${INSPECTAI_SUPERVISOR_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TMP_IMAGE_TTL_HOURS: ${TMP_IMAGE_TTL_HOURS:-24}
    volumes:
      - ./storage:/app/storage
    ports:
      - "18080:8080"
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  admin-frontend:
    image: ${REGISTRY:-inspectai}/admin-frontend:${INSPECTAI_VERSION:-dev}
    build:
      context: .
      dockerfile: admin-frontend/Dockerfile
    ports:
      - "18081:80"
    depends_on:
      go-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.bootstrap.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "18088:80"
    depends_on:
      go-backend:
        condition: service_healthy
      admin-frontend:
        condition: service_healthy
