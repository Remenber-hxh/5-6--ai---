events {}

http {
  upstream inspectai_backend {
    server go-backend:8080;
  }

  upstream inspectai_admin {
    server admin-frontend:80;
  }

  server {
    listen 80;
    server_name ai-demo.jadeastech.com _;

    client_max_body_size 20m;

    # ACME HTTP-01 挑战路径（acme.sh / certbot 用 webroot 验证时放文件这里）
    # 走 HTTP 不重定向到 HTTPS，否则 CA 取不到验证文件
    location /.well-known/acme-challenge/ {
      root /var/www/acme;
      default_type "text/plain";
    }

    # 企业微信可信域名验证（HTTP 即可，不强制 HTTPS）
    location = /WW_verify_6ihTTmm4dVYOpuAQ.txt {
      add_header Content-Type "text/plain";
      return 200 "6ihTTmm4dVYOpuAQ";
    }

    # 管理后台：/admin/ → admin-frontend 容器
    location /admin/ {
      proxy_pass http://inspectai_admin/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余（移动端 + API + storage）都打到 go-backend
    location / {
      proxy_pass http://inspectai_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
