events {}

http {
  upstream inspectai_backend {
    server go-backend:8080;
  }

  upstream inspectai_admin {
    server admin-frontend:80;
  }

  # 公共路由块（80 和 443 都复用），通过 include 引入
  # 这里直接展开写，不用 include 简化结构

  # ============ HTTP (80) ============
  # 主要职责：
  # 1. ACME 续期 challenge（不能强制 HTTPS，CA 取不到）
  # 2. 企业微信验证文件（HTTP 即可）
  # 3. 其余流量 301 重定向到 HTTPS
  server {
    listen 80;
    server_name ai-demo.jadeastech.com _;

    client_max_body_size 20m;

    # ACME HTTP-01 挑战路径（Let's Encrypt 续期用）
    location /.well-known/acme-challenge/ {
      root /var/www/acme;
      default_type "text/plain";
    }

    # 企业微信可信域名验证（必须 HTTP 200）
    location = /WW_verify_6ihTTmm4dVYOpuAQ.txt {
      add_header Content-Type "text/plain";
      return 200 "6ihTTmm4dVYOpuAQ";
    }

    # 其余流量全部跳 HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ============ HTTPS (443) ============
  server {
    listen 443 ssl;
    http2 on;
    server_name ai-demo.jadeastech.com;

    client_max_body_size 20m;

    # Let's Encrypt 证书（由 acme.sh install-cert 装到这里）
    ssl_certificate     /etc/nginx/ssl/ai-demo.jadeastech.com.crt;
    ssl_certificate_key /etc/nginx/ssl/ai-demo.jadeastech.com.key;

    # 现代化 TLS 配置（参考 Mozilla intermediate）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS（强制浏览器一年内走 HTTPS）。如果还在调试可以注释掉。
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 企业微信验证 HTTPS 也响应（部分场景会从 HTTPS 拉）
    location = /WW_verify_6ihTTmm4dVYOpuAQ.txt {
      add_header Content-Type "text/plain";
      return 200 "6ihTTmm4dVYOpuAQ";
    }

    # 管理后台
    location /admin/ {
      proxy_pass http://inspectai_admin/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 新版管理后台(admin-web,React 构建产物;HashRouter 无需 history 回退)
    location /v2/ {
      alias /usr/share/nginx/admin-web/;
      index index.html;
      try_files $uri $uri/ /v2/index.html;
    }

    # 其余 → go-backend
    location / {
      proxy_pass http://inspectai_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
