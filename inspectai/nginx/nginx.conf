events {}

http {
  upstream inspectai_backend {
    server go-backend:8080;
  }

  upstream inspectai_admin {
    server admin-frontend:80;
  }

  server {
    listen 80;
    server_name ai-demo.jadeastech.com _;

    client_max_body_size 20m;

    # 企业微信可信域名验证（HTTP 即可，不强制 HTTPS）
    # 文件名带的字符串和文件内容一致 = 企业微信约定
    location = /WW_verify_6ihTTmm4dVYOpuAQ.txt {
      add_header Content-Type "text/plain";
      return 200 "6ihTTmm4dVYOpuAQ";
    }

    # 管理后台：/admin/ → admin-frontend 容器
    location /admin/ {
      proxy_pass http://inspectai_admin/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余（移动端 + API + storage）都打到 go-backend
    location / {
      proxy_pass http://inspectai_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
