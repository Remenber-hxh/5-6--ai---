events {}

http {
  upstream inspectai_backend {
    server go-backend:8080;
  }

  upstream inspectai_admin {
    server admin-frontend:80;
  }

  # First-deploy HTTP-only config. Use it before Let's Encrypt certificates exist.
  server {
    listen 80;
    server_name ai-demo.jadeastech.com _;

    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
      root /var/www/acme;
      default_type "text/plain";
    }

    location = /WW_verify_6ihTTmm4dVYOpuAQ.txt {
      add_header Content-Type "text/plain";
      return 200 "6ihTTmm4dVYOpuAQ";
    }

    location /admin/ {
      proxy_pass http://inspectai_admin/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://inspectai_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
