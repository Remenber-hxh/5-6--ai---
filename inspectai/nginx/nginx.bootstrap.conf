events {}

http {
  # MIME 类型表:缺了它 nginx 会把 .js/.css 当 text/plain 发出,
  # 浏览器按 HTML 规范拒绝执行模块脚本 → /v2/ 静态页白屏。
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  upstream inspectai_backend {
    server go-backend:8080;
  }

  upstream inspectai_admin {
    server admin-frontend:80;
  }

  # First-deploy HTTP-only config. Use it before Let's Encrypt certificates exist.
  server {
    listen 80;
    server_name jadeast.cloud www.jadeast.cloud _;

    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
      root /var/www/acme;
      default_type "text/plain";
    }

    location = /WW_verify_6ihTTmm4dVYOpuAQ.txt {
      add_header Content-Type "text/plain";
      return 200 "6ihTTmm4dVYOpuAQ";
    }

    location /admin/ {
      proxy_pass http://inspectai_admin/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://inspectai_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
