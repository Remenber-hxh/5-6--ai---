services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    restart: unless-stopped
    environment:
      AI_SERVICE_ADDR: 0.0.0.0
      AI_SERVICE_PORT: 9100
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_VISION_MODEL: ${QWEN_VISION_MODEL:-qwen-vl-plus}
      QWEN_VISION_FALLBACK: ${QWEN_VISION_FALLBACK:-qwen-vl-max}
      QWEN_TEXT_MODEL: ${QWEN_TEXT_MODEL:-qwen-plus}
      TMP_IMAGE_TTL_HOURS: ${TMP_IMAGE_TTL_HOURS:-24}
    volumes:
      - app_storage:/app/storage:ro
    expose:
      - "9100"

  go-backend:
    build:
      context: .
      dockerfile: go-backend/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_ADDR: ":8080"
      AI_SERVICE_URL: "http://ai-service:9100"
      FRONTEND_DIR: "/app/frontend"
      STORAGE_DIR: "/app/storage"
      DB_DRIVER: "mysql"
      MYSQL_DSN: "${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=false&loc=Local"
      GOTELEMETRY: "off"
      INSPECTAI_AUTH_TOKEN: ${INSPECTAI_AUTH_TOKEN}
      TMP_IMAGE_TTL_HOURS: ${TMP_IMAGE_TTL_HOURS:-24}
    volumes:
      - app_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      go-backend:
        condition: service_started

volumes:
  mysql_data:
  app_storage:
