<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover:允许内容延伸到刘海/圆角区,再用 safe-area 让开 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#07131f" />
    <title>智巡</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* ===== 视口地基:一次做对,根治旧版反复出现的 100vh / 安全区 / 回弹白边 ===== */
      :root {
        /* svh = 手机真实可视高度(地址栏收起后的最大高度是 lvh,会顶出内容)。
           不支持 svh 的老浏览器回落 vh。 */
        --app-vh: 100vh;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --ground: #0b1620;
      }
      @supports (height: 100svh) {
        :root { --app-vh: 100svh; }
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body, #root {
        margin: 0;
        height: var(--app-vh);
        /* 禁橡皮筋回弹:既去掉露白边,也防误触下拉刷新导致 SPA 重载丢状态 */
        overscroll-behavior: none;
      }
      html { background: var(--ground); }
      body {
        overflow: hidden; /* 滚动交给内部容器,body 本身不滚 */
        /* 【必须显式写】Arco 的 setRootPixel 把 html 设成 325%(=52px)当 rem 基准。
           body 不自己定字号就会继承这 52px —— 于是任何忘了写 font-size 的文字
           都是巨字。之前"长按选相册"按钮的巨字 bug 就是这么来的。
           这里给一个正常正文值,让继承落在安全处。 */
        font-size: 15px;
        line-height: 1.5;
        /* 拉丁与数字先给系统 UI 字体(iOS 的 SF、Windows 的 Segoe UI),
           汉字再往后落 —— 中文字体自带的西文字形普遍偏弱,而这个 app 满屏
           是设备编号和时间。
           中文按"各家自己的现代字体"排:华为的 HarmonyOS Sans、小米的 MiSans
           都是机器自带、免下载,观感远好于退到微软雅黑。
           微软雅黑放最后:它只有 Regular/Bold 两个真字重,排前面会让 500/600
           全变成浏览器合成的假粗。 */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "HarmonyOS Sans SC", "MiSans", "OPPO Sans",
          "Noto Sans SC", "Source Han Sans SC", system-ui,
          "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root { display: flex; flex-direction: column; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
