# InspectAI 生产环境 compose
#
# 安全模型：所有敏感凭据都通过 Docker secret 挂载到容器，
# 而非以明文 env 变量传入。容器内通过 <NAME>_FILE 环境变量读路径。
#
# 部署前先在主机上准备 secret 文件（默认在 ./secrets/ 下）：
#   ./secrets/dashscope_api_key
#   ./secrets/mysql_password
#   ./secrets/mysql_root_password
#   ./secrets/inspectai_auth_token
#   ./secrets/inspectai_supervisor_token
#   ./secrets/inspectai_admin_password
#
# 详细操作见 docs/DEPLOY.md（生成 secret + 权限收紧 + 备份策略）。

secrets:
  dashscope_api_key:
    file: ./secrets/dashscope_api_key
  mysql_password:
    file: ./secrets/mysql_password
  mysql_root_password:
    file: ./secrets/mysql_root_password
  inspectai_auth_token:
    file: ./secrets/inspectai_auth_token
  inspectai_supervisor_token:
    file: ./secrets/inspectai_supervisor_token
  inspectai_admin_password:
    file: ./secrets/inspectai_admin_password
  mysql_dsn:
    file: ./secrets/mysql_dsn

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      # MySQL 官方镜像原生支持 _FILE 约定
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_password
      - mysql_root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # healthcheck 也走 secret，避免在 process list 看到密码
      test:
        - "CMD-SHELL"
        - "mysqladmin ping -h 127.0.0.1 -u root -p$$(cat /run/secrets/mysql_root_password) --silent"
      interval: 10s
      timeout: 5s
      retries: 12

  ai-service:
    image: ${REGISTRY:-inspectai}/ai-service:${INSPECTAI_VERSION:-latest}
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    restart: unless-stopped
    environment:
      AI_SERVICE_ADDR: 0.0.0.0
      AI_SERVICE_PORT: 9100
      # 不再传 DASHSCOPE_API_KEY；指向 secret 文件
      DASHSCOPE_API_KEY_FILE: /run/secrets/dashscope_api_key
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_VISION_MODEL: ${QWEN_VISION_MODEL:-qwen-vl-plus}
      QWEN_VISION_FALLBACK: ${QWEN_VISION_FALLBACK:-qwen-vl-max}
      QWEN_TEXT_MODEL: ${QWEN_TEXT_MODEL:-qwen-plus}
      TMP_IMAGE_TTL_HOURS: ${TMP_IMAGE_TTL_HOURS:-24}
    secrets:
      # 短格式。非 swarm 模式下 uid/gid/mode 被忽略（Docker 会直接 bind-mount
      # host 文件，owner 跟随 host）。所以正确做法是 host 上把 secret 文件
      # chown 给 uid 10001（容器内 inspectai 用户）— 见 prepare-secrets.sh。
      - dashscope_api_key
    volumes:
      - app_storage:/app/storage:ro
    expose:
      - "9100"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/health"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  go-backend:
    image: ${REGISTRY:-inspectai}/go-backend:${INSPECTAI_VERSION:-latest}
    build:
      context: .
      dockerfile: go-backend/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_ADDR: ":8080"
      AI_SERVICE_URL: "http://ai-service:9100"
      FRONTEND_DIR: "/app/frontend"
      STORAGE_DIR: "/app/storage"
      DB_DRIVER: "mysql"
      # MYSQL_DSN 内嵌密码，故走 secret 文件。run.py / Go 都已实现 _FILE 兜底。
      MYSQL_DSN_FILE: /run/secrets/mysql_dsn
      GOTELEMETRY: "off"
      INSPECTAI_AUTH_TOKEN_FILE: /run/secrets/inspectai_auth_token
      INSPECTAI_SUPERVISOR_TOKEN_FILE: /run/secrets/inspectai_supervisor_token
      INSPECTAI_ADMIN_USER: ${INSPECTAI_ADMIN_USER:-admin}
      INSPECTAI_ADMIN_PASSWORD_FILE: /run/secrets/inspectai_admin_password
      INSPECTAI_ADMIN_NAME: ${INSPECTAI_ADMIN_NAME:-张管理员}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TMP_IMAGE_TTL_HOURS: ${TMP_IMAGE_TTL_HOURS:-24}
    secrets:
      - mysql_dsn
      - inspectai_auth_token
      - inspectai_supervisor_token
      - inspectai_admin_password
    volumes:
      - app_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  admin-frontend:
    image: ${REGISTRY:-inspectai}/admin-frontend:${INSPECTAI_VERSION:-latest}
    build:
      context: .
      dockerfile: admin-frontend/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      go-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # ACME HTTP-01 webroot：acme.sh 把验证文件丢这里，CA 经 nginx 取
      - ./nginx/acme-webroot:/var/www/acme:ro
      # SSL 证书目录：acme.sh 装证书到这里，nginx 加 443 server block 时引用
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      go-backend:
        condition: service_healthy
      admin-frontend:
        condition: service_healthy

# MYSQL_DSN 因为引用了 user/database 名称（非敏感），由部署脚本生成完整 DSN
# 写入 ./secrets/mysql_dsn。见 docs/DEPLOY.md。
volumes:
  mysql_data:
  app_storage:
