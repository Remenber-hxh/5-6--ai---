<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JADEAST 智巡后台</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="./assets/fonts/noto-sc-400.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="./assets/fonts/noto-sc-700.woff2" />
  <link rel="stylesheet" href="./styles.css?v=20260624-sbuser1" />
</head>
<body>
  <div class="monitor-frame">
    <div class="admin-shell">
      <aside class="sidebar">
        <div class="brand">JADEAST <span>智巡后台</span></div>
        <nav class="nav" aria-label="后台导航">
          <button data-page="dashboard"><img src="./assets/nav-home.svg" alt=""/>首页</button>
          <span>巡检管理</span>
          <button data-page="plan"><img src="./assets/nav-plan.svg" alt=""/>巡检计划</button>
          <button data-page="record"><img src="./assets/nav-record.svg" alt=""/>巡检记录</button>
          <button data-page="ledger"><img src="./assets/nav-asset.svg" alt=""/>资产台账</button>
          <button data-page="approval"><img src="./assets/nav-approval.svg" alt=""/>审批中心</button>
          <span>数据中心</span>
          <button data-page="data"><img src="./assets/nav-data.svg" alt=""/>数据看板</button>
          <span>账号与审计</span>
          <button data-page="profile"><img src="./assets/nav-profile.svg" alt=""/>个人首页</button>
          <button data-page="users"><img src="./assets/nav-users.svg" alt=""/>用户与权限</button>
          <button data-page="logs"><img src="./assets/nav-logs.svg" alt=""/>操作日志</button>
          <button data-page="system"><img src="./assets/nav-system.svg" alt=""/>系统管理</button>
        </nav>
        <button class="sidebar-user admin-user" type="button" id="sidebarUser" title="个人首页"><b>管</b><span class="su-text"><span class="su-name">管理员</span><span class="su-role">管理员</span></span></button>
      </aside>

      <header class="topbar">
        <button class="sidebar-toggle" id="sidebarToggle" type="button" title="收起 / 展开侧边栏" aria-label="收起侧边栏" aria-expanded="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6.5" x2="20" y2="6.5"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17.5" x2="20" y2="17.5"/></svg>
        </button>
        <div class="topbar-actions">
          <button class="icon-btn" id="refreshBtn" title="刷新"><img src="./assets/icon-refresh.svg" alt="" /><em id="pendingBadge">0</em></button>
          <button class="icon-btn" id="systemConfigBtn" title="系统配置"><img src="./assets/icon-settings.svg" alt="" /></button>
          <button class="approval-shortcut" id="approvalShortcut" type="button" title="进入审批中心">待审批 <b id="approvalShortcutCount">0</b></button>
        </div>
      </header>

      <main class="content" id="pageMain"></main>
      <aside class="detail-panel" id="pageAside"></aside>
    </div>
  </div>

  <div class="drawer-mask" id="drawerMask" hidden></div>
  <aside class="drawer" id="drawer" hidden>
    <button class="drawer-close" id="drawerClose" aria-label="关闭">×</button>
    <div id="drawerBody"></div>
  </aside>

  <div class="toast" id="toast"></div>
  <script>
    /* 主动加载两个字重，避免浏览器懒加载导致粗体字（700）退回微软雅黑 */
    if (document.fonts && document.fonts.load) {
      document.fonts.load('400 1em "Noto Sans SC"');
      document.fonts.load('700 1em "Noto Sans SC"');
    }
  </script>
  <script src="./app.js?v=20260624-sbuser1"></script>
</body>
</html>
