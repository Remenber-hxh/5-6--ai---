<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JADEAST 智巡后台</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css?v=20260609-approval-center-1" />
</head>
<body>
  <div class="monitor-frame">
    <div class="admin-shell">
      <aside class="sidebar">
        <div class="brand">JADEAST <span>智巡后台</span></div>
        <nav class="nav" aria-label="后台导航">
          <button data-page="dashboard"><img src="./assets/nav-home.svg" alt=""/>首页</button>
          <span>巡检管理</span>
          <button data-page="plan"><img src="./assets/nav-plan.svg" alt=""/>巡检计划</button>
          <button data-page="record"><img src="./assets/nav-record.svg" alt=""/>巡检记录</button>
          <button data-page="ledger"><img src="./assets/nav-asset.svg" alt=""/>资产台账</button>
          <button data-page="approval"><img src="./assets/nav-approval.svg" alt=""/>审批中心</button>
          <span>数据中心</span>
          <button data-page="data"><img src="./assets/nav-data.svg" alt=""/>数据看板</button>
          <span>账号与审计</span>
          <button data-page="profile"><img src="./assets/nav-profile.svg" alt=""/>个人首页</button>
          <button data-page="users"><img src="./assets/nav-users.svg" alt=""/>用户与权限</button>
          <button data-page="logs"><img src="./assets/nav-logs.svg" alt=""/>操作日志</button>
          <button data-page="system"><img src="./assets/nav-system.svg" alt=""/>系统管理</button>
        </nav>
      </aside>

      <header class="topbar">
        <label class="company-select" aria-label="项目筛选">
          <select id="projectSelect"></select>
        </label>
        <div class="topbar-actions">
          <button class="icon-btn" id="refreshBtn" title="刷新"><img src="./assets/icon-refresh.svg" alt="" /><em id="pendingBadge">0</em></button>
          <button class="approval-shortcut" id="approvalShortcut" type="button" title="进入审批中心">待审批 <b id="approvalShortcutCount">0</b></button>
          <button class="icon-btn" id="systemConfigBtn" title="系统配置"><img src="./assets/icon-settings.svg" alt="" /></button>
          <div class="admin-user"><b>张</b><span>张管理员</span></div>
        </div>
      </header>

      <main class="content" id="pageMain"></main>
      <aside class="detail-panel" id="pageAside"></aside>
    </div>
  </div>

  <div class="drawer-mask" id="drawerMask" hidden></div>
  <aside class="drawer" id="drawer" hidden>
    <button class="drawer-close" id="drawerClose" aria-label="关闭">×</button>
    <div id="drawerBody"></div>
  </aside>

  <div class="toast" id="toast"></div>
  <script src="./app.js?v=20260609-approval-center-1"></script>
</body>
</html>
