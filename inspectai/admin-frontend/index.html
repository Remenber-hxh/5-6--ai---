<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JADEAST 智巡后台</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css?v=20260601-cphase-a3" />
</head>
<body>
  <div class="monitor-frame">
    <div class="admin-shell">
      <aside class="sidebar">
        <div class="brand">JADEAST <span>智巡后台</span></div>
        <nav class="nav" aria-label="后台导航">
          <button data-page="dashboard"><img src="./assets/nav-home.svg" alt=""/>首页</button>
          <button data-page="exception"><img src="./assets/nav-exception.svg" alt=""/>待办</button>
          <button data-page="ledger"><img src="./assets/nav-asset.svg" alt=""/>资产</button>
          <button data-page="record"><img src="./assets/nav-record.svg" alt=""/>记录</button>
          <button data-page="data"><img src="./assets/nav-data.svg" alt=""/>洞察台</button>
          <span data-role-only="admin">管理</span>
          <button data-page="users" data-role-only="admin"><img src="./assets/nav-users.svg" alt=""/>用户</button>
          <button data-page="logs" data-role-only="admin"><img src="./assets/nav-logs.svg" alt=""/>操作日志</button>
          <button data-page="system" data-role-only="admin"><img src="./assets/nav-system.svg" alt=""/>系统</button>
          <!-- 路由保留,nav 隐藏 -->
          <button data-page="plan" hidden>巡检计划</button>
          <button data-page="task" hidden>巡检任务</button>
          <button data-page="device" hidden>设备管理</button>
          <button data-page="approval" hidden>修改审批</button>
          <button data-page="profile" hidden>个人首页</button>
          <button data-page="report" hidden>统计报表</button>
        </nav>
      </aside>

      <header class="topbar">
        <label class="company-select" aria-label="项目筛选">
          <select id="projectSelect"></select>
        </label>
        <div class="topbar-actions">
          <button class="icon-btn" id="refreshBtn" title="刷新"><img src="./assets/icon-refresh.svg" alt="" /><em id="pendingBadge">0</em></button>
          <button class="icon-btn" id="systemConfigBtn" title="系统配置"><img src="./assets/icon-settings.svg" alt="" /></button>
          <div class="admin-user"><b>张</b><span>张管理员</span></div>
        </div>
      </header>

      <main class="content" id="pageMain"></main>
      <aside class="detail-panel" id="pageAside"></aside>
    </div>
  </div>

  <div class="drawer-mask" id="drawerMask" hidden></div>
  <aside class="drawer" id="drawer" hidden>
    <button class="drawer-close" id="drawerClose" aria-label="关闭">×</button>
    <div id="drawerBody"></div>
  </aside>

  <div class="toast" id="toast"></div>
  <script src="./app.js?v=20260601-cphase-a"></script>
</body>
</html>
